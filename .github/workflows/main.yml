name: Deploy Website Frontend to EC2

on:
  push:
    branches: [ main ] 

jobs:
  deploy:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}  
          known_hosts: ${{ secrets.KNOWN_HOSTS }}  

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.EC2_IP }} "rm -rf /var/www/tipsgalwarFrontend/*"
          
          scp -r -o StrictHostKeyChecking=no ./ root@${{ secrets.EC2_IP }}:/var/www/tipsgalwarFrontend/
          
          ssh -o StrictHostKeyChecking=no root@${{ secrets.EC2_IP }} "systemctl restart nginx"
